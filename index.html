<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体重管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>体重管理</h1>

  <div class="stats" id="stats"></div>

  <div class="card">
    <form id="record-form">
      <div>
        <label for="height">身長 (cm)</label>
        <input type="number" step="0.1" id="height" required>
      </div>
      <div>
        <label for="weight">体重 (kg)</label>
        <input type="number" step="0.1" id="weight" required>
      </div>
      <div>
        <label for="bodyFat">体脂肪率 (%)</label>
        <input type="number" step="0.1" id="bodyFat" required>
      </div>
      <div>
        <label for="muscleMass">骨格筋肉量 (kg)</label>
        <input type="number" step="0.1" id="muscleMass" required>
      </div>
      <div>
        <label for="visceralFat">内臓脂肪レベル</label>
        <input type="number" step="0.1" id="visceralFat" required>
      </div>
      <div>
        <label for="measuredAt">測定日時</label>
        <input type="datetime-local" id="measuredAt" required>
      </div>
      <div class="full">
        <button type="submit" class="primary" id="submit-btn">記録する</button>
      </div>
    </form>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <canvas id="weightChart" height="180"></canvas>
  </div>
  <div class="card">
    <canvas id="bodyFatChart" height="180"></canvas>
  </div>
  <div class="card">
    <canvas id="muscleMassChart" height="180"></canvas>
  </div>
  <div class="card">
    <canvas id="visceralFatChart" height="180"></canvas>
  </div>

  <div class="card">
    <table id="records-table">
      <thead>
        <tr>
          <th>日時</th>
          <th>体重</th>
          <th>体脂肪率</th>
          <th>骨格筋肉量</th>
          <th>内臓脂肪</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="records-body"></tbody>
    </table>
    <div class="empty" id="empty-message">まだ記録がありません</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
